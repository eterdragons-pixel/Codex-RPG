<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex RPG</title><style>:root{font-family:system-ui,Arial;background:#10131c;color:#e9e9f0}*{box-sizing:border-box}body{margin:0}header{padding:22px;background:#1b2030;border-bottom:1px solid #383d4e}h1{margin:0;color:#dfb875}small,.muted{color:#aeb5c8}nav{display:flex;gap:8px;flex-wrap:wrap;padding:14px 22px;background:#171b29}button,select,input,textarea{font:inherit;border:1px solid #4a5266;border-radius:8px;padding:10px;background:#242b3b;color:#fff}button{cursor:pointer}button:hover{background:#38445d}.primary{background:#856032;border-color:#a67e46}main{max-width:1100px;margin:auto;padding:24px}.panel{background:#1b2030;border:1px solid #353d50;border-radius:12px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px;margin:8px 0}.field input,.field select,.field textarea{width:100%}.card{background:#242b3b;border-radius:10px;padding:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hidden{display:none}.tag{font-size:12px;color:#e8c990}.danger{color:#ffaaa7}.stat{font-size:24px;color:#dfb875;font-weight:bold}textarea{min-height:90px}footer{padding:20px;text-align:center;color:#8d97ab}</style></head><body><header><h1>⚔ Codex RPG</h1><small>Fichas multissistema • Protótipo funcional v0.1</small></header><nav id="nav"></nav><main id="app"></main><footer>Os dados ficam neste navegador. Exporte backups regularmente.</footer><script>
const SYSTEMS={'d35':'D&D 3.5','d4':'D&D 4ª Edição','got20':'Guerra dos Tronos D20','gotd6':'Guerra dos Tronos D6','hunter':'Hunter: The Vigil','shadow':'Shadow of the Demon Lord','custom':'Sistema personalizado'};
const KEY='codex_rpg_v01';let data;try{data=JSON.parse(localStorage.getItem(KEY))||{characters:[],campaigns:[]}}catch{data={characters:[],campaigns:[]}};let page='painel',editing=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());const mod=n=>Math.floor((Number(n)-10)/2);const signed=n=>n>=0?'+'+n:String(n);
const ABIL=['Força','Destreza','Constituição','Inteligência','Sabedoria','Carisma'];const short=['FOR','DES','CON','INT','SAB','CAR'];const schema={d35:{attributes:ABIL,defaultValue:10,calculation:'d20'},d4:{attributes:ABIL,defaultValue:10,calculation:'d20'},got20:{attributes:[],defaultValue:0,calculation:'manual'},gotd6:{attributes:[],defaultValue:0,calculation:'manual'},hunter:{attributes:['Inteligência','Raciocínio','Perseverança','Força','Destreza','Vigor','Presença','Manipulação','Autocontrole'],defaultValue:1,calculation:'dots'},shadow:{attributes:['Força','Agilidade','Intelecto','Vontade'],defaultValue:10,calculation:'shadow'},custom:{attributes:[],defaultValue:0,calculation:'manual'}};
function nav(){ $('nav').innerHTML=[['painel','Painel'],['biblioteca','Biblioteca'],['criar','Criar ficha'],['campanhas','Campanhas'],['sistemas','Sistemas'],['backup','Backup']].map(([id,label])=>`<button ${page===id?'class="primary"':''} onclick="go('${id}')">${label}</button>`).join('')};function go(p){page=p;editing=null;render()};function render(){nav();const pages={painel:dashboard,biblioteca:library,criar:creator,campanhas:campaigns,sistemas:systems,backup:backups};$('app').innerHTML=pages[page]()};
function dashboard(){return `<h2>Painel inicial</h2><div class="grid"><div class="panel"><div class="stat">${data.characters.length}</div>Personagens</div><div class="panel"><div class="stat">${data.campaigns.length}</div>Campanhas</div><div class="panel"><div class="stat">7</div>Sistemas configurados</div></div><div class="panel"><h3>Comece sua jornada</h3><p class="muted">Crie fichas, organize campanhas e acompanhe atributos.</p><button class="primary" onclick="go('criar')">+ Criar personagem</button></div>`}
function library(){return `<h2>Biblioteca de personagens</h2><input id="filter" placeholder="Pesquisar por nome, sistema ou campanha" oninput="filterCards()"><div id="cards" class="grid" style="margin-top:16px">${cardList(data.characters)}</div>`};function cardList(items){return items.slice().sort((a,b)=>a.name.localeCompare(b.name,'pt-BR')).map(c=>`<div class="card"><h3>${esc(c.name)}</h3><div class="tag">${esc(SYSTEMS[c.system])}</div><p>${esc(c.concept||'Sem conceito')} • Nível/Rank ${esc(c.level)}</p><small>${esc(data.campaigns.find(x=>x.id===c.campaign)?.name||'Sem campanha')}</small><div class="row" style="margin-top:12px"><button onclick="editChar('${c.id}')">Editar</button><button onclick="duplicateChar('${c.id}')">Duplicar</button><button onclick="deleteChar('${c.id}')">Excluir</button></div></div>`).join('')||'<p class="muted">Nenhum personagem encontrado.</p>'};function filterCards(){let q=$('filter').value.toLowerCase();$('cards').innerHTML=cardList(data.characters.filter(c=>[c.name,SYSTEMS[c.system],data.campaigns.find(x=>x.id===c.campaign)?.name].join(' ').toLowerCase().includes(q)))};
function creator(){let c=data.characters.find(x=>x.id===editing)||{name:'',system:'d35',level:1,concept:'',campaign:'',attributes:{},notes:'',hp:0,resource:0};return `<h2>${editing?'Editar':'Criar'} personagem</h2><div class="panel"><div class="grid"><label class="field">Nome<input id="name" value="${esc(c.name)}"></label><label class="field">Sistema<select id="system" onchange="changeSystem()">${Object.entries(SYSTEMS).map(([k,v])=>`<option value="${k}" ${c.system===k?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">Nível / Rank<input id="level" type="number" min="0" value="${esc(c.level)}"></label><label class="field">Classe / Conceito / Trilha<input id="concept" value="${esc(c.concept)}"></label><label class="field">Campanha<select id="campaign"><option value="">Sem campanha</option>${data.campaigns.map(x=>`<option value="${x.id}" ${c.campaign===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label class="field">Pontos de vida atuais<input id="hp" type="number" value="${esc(c.hp)}"></label></div><h3>Atributos</h3><p class="muted" id="ruleNote"></p><div id="attributes" class="grid"></div><div class="row"><input id="newAttr" placeholder="Novo atributo personalizado"><button onclick="addAttr()">Adicionar atributo</button></div><h3>Anotações, poderes e equipamentos</h3><textarea id="notes">${esc(c.notes)}</textarea><div class="row" style="margin-top:16px"><button class="primary" onclick="saveChar()">Salvar ficha</button><button onclick="go('biblioteca')">Cancelar</button></div></div>`+`<script-placeholder></script-placeholder>`}
function setupCreator(attrs){let sys=$('system').value, s=schema[sys];let names=[...new Set([...s.attributes,...Object.keys(attrs||{})])];$('attributes').innerHTML=names.map((n,i)=>`<label class="field">${esc(n)}<input class="attr" data-name="${esc(n)}" type="number" value="${Number(attrs?.[n]??s.defaultValue)}" oninput="updateMods()"><small class="muted" id="m${i}"></small></label>`).join('');$('ruleNote').textContent=s.calculation==='d20'?'Modificador automático: ⌊(atributo − 10) / 2⌋. Outros valores dependem das regras do sistema.':s.calculation==='shadow'?'Modificador automático dos atributos: valor − 10.':'Atributos editáveis. Fórmulas específicas aguardam validação.';updateMods()};function updateMods(){let sys=$('system').value;document.querySelectorAll('.attr').forEach((e,i)=>{let n=Number(e.value),calc=schema[sys].calculation;let m=$('m'+i);if(m)m.textContent=calc==='d20'?'Modificador '+signed(mod(n)):calc==='shadow'?'Modificador '+signed(n-10):''})};function changeSystem(){setupCreator({})};function addAttr(){let n=$('newAttr').value.trim();if(!n)return;let attrs=readAttrs();attrs[n]=0;setupCreator(attrs);$('newAttr').value=''};function readAttrs(){return Object.fromEntries([...document.querySelectorAll('.attr')].map(e=>[e.dataset.name,Number(e.value)]))};function saveChar(){let name=$('name').value.trim();if(!name){alert('Informe o nome do personagem.');return}let old=data.characters.find(c=>c.id===editing);let c={id:editing||uid(),name,system:$('system').value,level:Number($('level').value),concept:$('concept').value,campaign:$('campaign').value,hp:Number($('hp').value),attributes:readAttrs(),notes:$('notes').value,created:old?.created||new Date().toISOString()};if(old)Object.assign(old,c);else data.characters.push(c);save();go('biblioteca')};function editChar(id){editing=id;page='criar';render()};function duplicateChar(id){let c=data.characters.find(x=>x.id===id);data.characters.push({...c,id:uid(),name:c.name+' (cópia)',attributes:{...c.attributes}});save();render()};function deleteChar(id){if(confirm('Excluir esta ficha?')){data.characters=data.characters.filter(c=>c.id!==id);save();render()}};
function campaigns(){return `<h2>Campanhas</h2><div class="panel"><div class="row"><input id="campName" placeholder="Nome da campanha"><button class="primary" onclick="addCamp()">Criar campanha</button></div></div><div class="grid">${data.campaigns.map(c=>`<div class="card"><h3>${esc(c.name)}</h3><p>${data.characters.filter(x=>x.campaign===c.id).length} personagens</p><button onclick="deleteCamp('${c.id}')">Excluir</button></div>`).join('')}</div>`};function addCamp(){let name=$('campName').value.trim();if(!name)return;data.campaigns.push({id:uid(),name});save();render()};function deleteCamp(id){if(!confirm('Excluir campanha? As fichas serão mantidas.'))return;data.campaigns=data.campaigns.filter(x=>x.id!==id);data.characters.forEach(c=>{if(c.campaign===id)c.campaign=''});save();render()};
function systems(){return `<h2>Sistemas disponíveis</h2><div class="grid">${Object.entries(SYSTEMS).map(([id,name])=>`<div class="card"><h3>${esc(name)}</h3><p class="muted">${schema[id].attributes.length} atributos iniciais configurados</p><small>${['d35','d4','shadow'].includes(id)?'Modificadores básicos automáticos':'Estrutura editável; regras completas pendentes'}</small></div>`).join('')}</div><div class="panel"><h3>Política de regras</h3><p>Fórmulas não validadas permanecem manuais. Este protótipo não afirma oferecer criação integral pelas regras oficiais.</p></div>`};function backups(){return `<h2>Backup e restauração</h2><div class="panel"><p>Exporte todas as fichas e campanhas em JSON.</p><button class="primary" onclick="exportData()">Exportar backup</button><label class="field">Importar backup JSON<input type="file" accept="application/json,.json" onchange="importData(event)"></label><p class="danger">Importar substitui os dados atuais. Exporte um backup antes.</p></div>`};function exportData(){let blob=new Blob([JSON.stringify({version:1,...data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='codex-rpg-backup.json';a.click();URL.revokeObjectURL(a.href)}async function importData(ev){try{let obj=JSON.parse(await ev.target.files[0].text());if(!Array.isArray(obj.characters)||!Array.isArray(obj.campaigns))throw Error('Formato inválido');if(!confirm('Substituir todas as fichas e campanhas atuais?'))return;data={characters:obj.characters,campaigns:obj.campaigns};save();go('painel')}catch(e){alert('Não foi possível importar: '+e.message)}};
const originalRender=render;render=function(){originalRender();if(page==='criar'){let c=data.characters.find(x=>x.id===editing);setupCreator(c?.attributes||{})}};render();
</script></body></html>
